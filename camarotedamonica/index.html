<style>
  :root {
    --bordo: #6b192a;
    --creme: #f2ebd9;
    --dourado: #d3a449;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bordo); color: var(--creme); }
  body {
    min-height: 100vh;
    min-height: 100svh;
    font-family: Georgia, serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  /* Largura do cartão: cabe na tela do celular e, no computador,
     a arte inteira do convite cabe na altura da janela. */
  :root { --cw: min(calc(100vw - 32px), 560px, calc((100vh - 32px) * .7524)); }
  @supports (height: 100svh) {
    :root { --cw: min(calc(100vw - 32px), 560px, calc((100svh - 32px) * .7524)); }
  }
  main {
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .cartao {
    /* 1 unidade = 1 ponto da prancheta do Illustrator (1249,26 de largura) */
    --u: calc(var(--cw) / 1249.26);
    position: relative;
    width: var(--cw);
    margin: 0 auto;
    padding-bottom: calc(150 * var(--u));
  }
  #convite { display: block; width: 100%; height: auto; }

  /* Moldura dourada, desenhada no código para envolver também os botões.
     Mesmas medidas, degradê e arredondamento da arte original. */
  #moldura {
    position: absolute;
    top: calc(62.22 * var(--u));
    left: calc(50.72 * var(--u));
    right: calc(50.71 * var(--u));
    bottom: calc(62.22 * var(--u));
    padding: calc(17 * var(--u));
    border-radius: calc(25.42 * var(--u));
    background: linear-gradient(90deg,
      #be893c 0%, #e3c776 17%, #faf5bc 29%, #be8f3f 39%, #dfad50 63%, #bb832c 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    pointer-events: none;
  }
  .js #moldura { opacity: 0; }
  html.fim #moldura { animation: none; opacity: .96; }

  /* ---------- Botões ---------- */
  /* Botões alinhados com a margem dos textos do convite */
  .acoes {
    position: relative;
    display: grid;
    gap: 12px;
    margin: calc(40 * var(--u)) calc(144 * var(--u)) 0;
  }
  .botao, .agenda summary {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    padding: 12px 20px;
    border: 1px solid var(--dourado);
    border-radius: 10px;
    background: transparent;
    color: var(--creme);
    text-decoration: none;
    cursor: pointer;
    transition: background-color .25s ease;
  }
  .botao:hover, .agenda summary:hover,
  .botao:focus-visible, .agenda summary:focus-visible {
    background: rgba(211, 164, 73, .14);
    outline: none;
  }
  .agenda summary { list-style: none; }
  .agenda summary::-webkit-details-marker { display: none; }
  .agenda[open] summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .agenda .opcoes {
    display: grid;
    border: 1px solid var(--dourado);
    border-top: 0;
    border-radius: 0 0 10px 10px;
    overflow: hidden;
  }
  .agenda .opcoes a {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 48px;
    padding: 12px 20px;
    color: var(--creme);
    text-decoration: none;
  }
  /* Textos dos botões: desenhos vetoriais exportados do Illustrator */
  .rotulo {
    --h: 15px;
    display: block;
    height: var(--h);
    width: calc(var(--w) * var(--h) / 41.7);
    overflow: visible;
    fill: currentColor;
  }
  .opcoes .rotulo { --h: 13px; opacity: .9; }
  /* Texto escrito, invisível na tela, para leitores de tela */
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .agenda .opcoes a + a { border-top: 1px solid rgba(211, 164, 73, .35); }
  .agenda .opcoes a:hover { background: rgba(211, 164, 73, .14); }

  /* ---------- Animação de abertura ---------- */
  /* Só esconde os elementos se o JavaScript estiver ativo,
     assim o convite nunca fica invisível. */
  .js #mascara { opacity: 0; }
  .js .anim, .js .acoes { opacity: 0; }

  #mascara {
    transform-box: fill-box;
    transform-origin: center;
    will-change: opacity, transform;
  }

  .play #mascara {
    animation:
      mascara-entra 1s cubic-bezier(.22,.61,.36,1) .2s both,
      mascara-dissolve 1.8s ease-in-out 1.8s forwards;
  }
  @keyframes mascara-entra {
    from { opacity: 0; transform: scale(1.04); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes mascara-dissolve {
    from { opacity: 1; }
    to   { opacity: .4; }
  }

  .play .anim, .play .acoes {
    animation: surge 1.1s ease-out both;
  }
  .play #moldura    { animation: surge-moldura 1.4s ease-out 3.0s both; }
  @keyframes surge-moldura { from { opacity: 0; } to { opacity: .96; } }
  .play #t-camarote { animation-delay: 3.5s; }
  .play #t-monica   { animation-delay: 3.75s; }
  .play #t-portoes  { animation-delay: 4.2s; }
  .play #t-data     { animation-delay: 4.4s; }
  .play #t-local    { animation-delay: 4.6s; }
  .play #t-abada    { animation-delay: 4.9s; }
  .play .acoes      { animation-delay: 5.3s; }
  @keyframes surge {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Toque na tela durante a abertura: pula direto para o convite */
  .fim #mascara { animation: none; opacity: .4; transform: none; }
  .fim .anim, .fim .acoes { animation: none; opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .js #mascara { opacity: .4; }
    .js .anim, .js .acoes { opacity: 1; }
    .js #moldura { opacity: .96; }
    .play #mascara, .play .anim, .play .acoes, .play #moldura { animation: none; }
  }
</style>

<script>
  (function () {
    var root = document.documentElement;
    var iniciou = false;

    function iniciar() {
      if (iniciou) return;
      iniciou = true;
      root.classList.add('play');
    }

    // Começa assim que a página estiver pronta.
    requestAnimationFrame(function () { requestAnimationFrame(iniciar); });

    // Um toque durante a abertura mostra o convite completo na hora.
    function pular() {
      if (root.classList.contains('play') && !root.classList.contains('fim')) {
        root.classList.add('fim');
      }
    }
    document.addEventListener('click', pular, { once: true });

    // Botão demonstrativo: não faz nada por enquanto.
    var demo = document.querySelector('[data-demo]');
    if (demo) demo.addEventListener('click', function (e) { e.preventDefault(); });
  })();
</script>
